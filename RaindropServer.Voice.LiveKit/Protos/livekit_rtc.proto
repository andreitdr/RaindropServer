// A trimmed copy of the signalling messages that carry ICE candidates, from github.com/livekit/protocol
// (protobufs/livekit_rtc.proto) at the same commit as livekit_room_service.proto. The signalling relay
// reads them only to point candidates at the address a client reached Raindrop by
// (LiveKitCandidateRewriter). Every other case of SignalResponse, and every field left out here, is kept
// as an unknown field and written back exactly as it came, so this file does not have to track the rest
// of the protocol. LiveKit never renumbers a field.

syntax = "proto3";

package livekit;

option csharp_namespace = "RaindropServer.Voice.LiveKit.Protocol";

message SignalResponse {
  oneof message {
    // The SFU's answer to the client's publisher offer.
    SessionDescription answer = 2;
    // The SFU's offer for the client's subscriber connection.
    SessionDescription offer = 3;
    // One ICE candidate, trickled.
    TrickleRequest trickle = 4;
  }
}

message SessionDescription {
  string type = 1;
  string sdp = 2;
}

message TrickleRequest {
  // A JSON RTCIceCandidateInit: {"candidate": "candidate:…", "sdpMid": …, "sdpMLineIndex": …}.
  string candidateInit = 1;
}
