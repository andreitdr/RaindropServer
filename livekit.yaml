# LiveKit settings for docker-compose.yml. The API key and secret are not here: they come from
# LIVEKIT_KEYS, built from LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env, so this file holds nothing
# secret and can be committed.

port: 7880

rtc:
  # One TCP and one UDP port, matching what docker-compose publishes, rather than LiveKit's default
  # range of 10,000 UDP ports.
  tcp_port: 7881
  udp_port: 7882
  # The advertised address comes from --node-ip; do not ask a STUN server for it.
  use_external_ip: false

# Only Raindrop connects to the API, and it only ever joins rooms it names itself.
room:
  auto_create: true
  empty_timeout: 60

logging:
  level: info

# Optional TURN relay for clients behind networks that block UDP entirely. TURN over TLS on 5349
# needs a certificate for `domain`; publish 5349/tcp in docker-compose.yml and uncomment:
#
# turn:
#   enabled: true
#   domain: turn.example.com
#   tls_port: 5349
#   cert_file: /etc/livekit/turn.crt
#   key_file: /etc/livekit/turn.key
