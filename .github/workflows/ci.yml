name: CI/CD

# On every push to main: build, then test. Releases are not made here; tag them
# with release.sh in the Raindrop root folder, which triggers release.yml.

# REQUIRED SETUP: the server compiles the wire protocol from the sibling RaindropProto repo
# (RaindropServer.Grpc reads ../../RaindropProto). If that repo is private, add a repository secret
# PROTO_REPO_TOKEN: a fine-grained personal access token with read-only "Contents" access to
# andreitdr/RaindropProto. The default GITHUB_TOKEN cannot read other repositories.

on:
  push:
    branches: [main]
  workflow_call: # also run as the first stage of release.yml

# A newer push supersedes a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: RaindropServer.sln
  PROTO_REPO: andreitdr/RaindropProto

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The workspace mirrors the local layout: <workspace>/RaindropServer next to <workspace>/RaindropProto.
    defaults:
      run:
        working-directory: RaindropServer
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaindropServer
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTO_REPO }}
          token: ${{ secrets.PROTO_REPO_TOKEN || github.token }}
          path: RaindropProto

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Compile
        run: dotnet build "$SOLUTION" -c Release --no-restore

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    # The workspace mirrors the local layout: <workspace>/RaindropServer next to <workspace>/RaindropProto.
    defaults:
      run:
        working-directory: RaindropServer
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaindropServer
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTO_REPO }}
          token: ${{ secrets.PROTO_REPO_TOKEN || github.token }}
          path: RaindropProto

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test "$SOLUTION" -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: RaindropServer/test-results
