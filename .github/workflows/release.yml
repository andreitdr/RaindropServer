name: Release

# Starts when release.sh pushes a version tag (vX.Y.Z). Builds and tests the tagged commit (ci.yml),
# packages the artefact, and only if all of that succeeded publishes a GitHub release for the tag
# with the artefact attached. GitHub adds the source-code zip itself.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.name }})
    needs: ci
    strategy:
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, rid: linux-x64 }
          - { name: macos, os: macos-latest, rid: osx-arm64 }
          - { name: windows, os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Windows defaults to PowerShell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Self-contained: the .NET runtime is included, so nothing needs installing to run the server.
      # Built on each target OS so the launcher and native libraries (SQLite) are the right ones.
      - name: Publish server
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish ServerCli/ServerCli.csproj -c Release -r "${{ matrix.rid }}" --self-contained true \
            -p:Version="$VERSION" -o publish/RaindropServer
          rm -f publish/RaindropServer/raindrop.db
          mkdir -p dist
          name="RaindropServer-$VERSION-${{ matrix.rid }}"
          if [ "${{ matrix.name }}" = "windows" ]; then
            (cd publish && 7z a -tzip "$GITHUB_WORKSPACE/dist/$name.zip" RaindropServer)
          else
            # tar keeps the executable bit on the server launcher.
            tar -czf "dist/$name.tar.gz" -C publish RaindropServer
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release for the existing tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
