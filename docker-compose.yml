# Local services for RaindropServer development: Postgres or SQL Server instead of the default
# SQLite, and a LiveKit media server for voice calls. Not required to run the server — only start
# what you actually configured as "database.provider" / "voice.provider" in raindrop.json.
#
# Usage:
#   cp .env.example .env          # then edit the passwords
#   docker compose up -d postgres      # or: sqlserver, livekit
#
# Data is bind-mounted to ./data on the host, so `docker compose down` (even `down -v`) and image
# updates never lose it — only deleting ./data does. That directory is gitignored.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raindrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-raindrop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-raindrop} -d $${POSTGRES_DB:-raindrop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver:
    # The official image is amd64-only; platform: linux/amd64 runs it under emulation on Apple
    # Silicon, which works but is slow. mcr.microsoft.com/azure-sql-edge is a native-arm64
    # alternative that speaks the same TDS protocol Microsoft.Data.SqlClient uses, if you'd rather
    # swap the image than eat the emulation cost.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env — 8+ chars, upper+lower+digit+symbol}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - ./data/sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  livekit:
    # The media server voice calls run on — see docs/voice.md. --dev means API key "devkey" and
    # secret "secret", which match raindrop.json's defaults: fine on your own machine, never on a
    # server anybody else can reach.
    #
    # --node-ip is the address LiveKit tells clients to send audio to. Docker cannot work it out from
    # inside the container, so set LIVEKIT_NODE_IP in .env: 127.0.0.1 when every client runs on this
    # machine, this machine's LAN address when phones or other computers join.
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      # The HTTP API and signalling. Only Raindrop talks to it — clients connect through Raindrop's
      # relay — so it is published on loopback alone.
      - "127.0.0.1:7880:7880"
      # The media: UDP, and TCP for networks that block UDP. These are what clients reach.
      - "7881:7881"
      - "7882:7882/udp"
