# The full RaindropServer stack: the server itself, plus the components it can run against —
# Postgres or SQL Server instead of the default SQLite, and a LiveKit media server for voice calls.
#
# Usage:
#   cp .env.example .env          # then edit the passwords and LIVEKIT_API_SECRET
#   docker compose up -d server        # brings up postgres and livekit too — server depends on both
#
# `server` is wired to Postgres and LiveKit by default (see the `server` service below); everything
# else — Postgres, SQL Server, LiveKit on their own — stays opt-in, only starting what you name:
#   docker compose up -d postgres      # or: sqlserver, livekit
#
# Data is bind-mounted to ./data on the host, so `docker compose down` (even `down -v`) and image
# updates never lose it — only deleting ./data does. That directory is gitignored.

services:
  server:
    # The Raindrop server itself, built from ServerCli/Dockerfile. Wired to Postgres and LiveKit by
    # default below — depends_on waits for Postgres to report healthy, and for LiveKit to have
    # started, before the server's own LiveKitStartupCheck runs. See
    # docs/local-development-and-docker.md for switching to SQLite/SQL Server or running without voice.
    build:
      context: .
      dockerfile: ServerCli/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      # Set explicitly rather than relying on the Dockerfile's baked-in ENV: an IDE's own Docker
      # Compose debug launcher (e.g. Rider's generated override) runs the Debug build directly and can
      # skip the final image stage those defaults live in, leaving Kestrel to fall back to
      # raindrop.json's "https://localhost:5001" — loopback-only, unreachable from outside the
      # container even though `docker compose ps` and the port mapping look fine.
      RAINDROP_URLS: https://0.0.0.0:5001
      RAINDROP_TLS_CERTIFICATE_PATH: /app/data/raindrop.pfx
      # The identity key too: without this it is written next to the executable, inside the container,
      # and a new one is generated whenever the container is recreated.
      RAINDROP_TLS_IDENTITY_KEY_PATH: /app/data/server-identity.key
      RAINDROP_DB_PROVIDER: postgres
      # Encrypted files members share, on the same mounted volume as the certificate and keys.
      RAINDROP_ATTACHMENTS_PATH: /app/data/attachments
      RAINDROP_DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-raindrop};Username=${POSTGRES_USER:-raindrop};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      RAINDROP_VOICE_PROVIDER: livekit
      RAINDROP_LIVEKIT_API_URL: http://livekit:7880
      RAINDROP_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-raindrop}
      RAINDROP_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env — openssl rand -base64 48}
      # DEVELOPMENT ONLY. Drops every table before the server starts — no confirmation, no undo. Off
      # by default; set RAINDROP_DEV_WIPE_DATABASE=true in .env for a "fresh database every restart"
      # dev loop, and never on a deployment whose data matters.
      RAINDROP_DEV_WIPE_DATABASE: ${RAINDROP_DEV_WIPE_DATABASE:-false}
    ports:
      - "${RAINDROP_PORT:-5001}:5001"
    volumes:
      # The TLS certificate and server identity key must outlive the container — see
      # ServerCli/Dockerfile and docs/transport-security.md#two-consequences.
      - ./data/server:/app/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raindrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-raindrop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 makes "healthy" mean "accepting TCP connections", which is how the server connects.
      # Over the default unix socket the check also passes against the temporary server the image runs
      # while it initialises a fresh data directory, which does not listen on TCP: on a slow first start
      # (a busy disk, an SD card) the server was released early and could not connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-raindrop} -d $${POSTGRES_DB:-raindrop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver:
    # The official image is amd64-only; platform: linux/amd64 runs it under emulation on Apple
    # Silicon, which works but is slow. mcr.microsoft.com/azure-sql-edge is a native-arm64
    # alternative that speaks the same TDS protocol Microsoft.Data.SqlClient uses, if you'd rather
    # swap the image than eat the emulation cost.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env — 8+ chars, upper+lower+digit+symbol}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - ./data/sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  livekit:
    # The media server voice calls run on — see docs/voice.md. Its settings are in livekit.yaml; the
    # API key and secret come from .env, and must match what Raindrop is given. Raindrop refuses
    # LiveKit's --dev credentials, so there is no insecure default to forget to change.
    #
    # --node-ip is the address LiveKit tells clients to send audio to. Docker cannot work it out from
    # inside the container, so set LIVEKIT_NODE_IP in .env: 127.0.0.1 when every client runs on this
    # machine, this machine's LAN address when phones or other computers join.
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-raindrop}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env — openssl rand -base64 48}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # The HTTP API and signalling. Only Raindrop talks to it — clients connect through Raindrop's
      # relay — so it is published on loopback alone.
      - "127.0.0.1:7880:7880"
      # The media: UDP, and TCP for networks that block UDP. These are what clients reach. Media is
      # DTLS-SRTP encrypted in transit, and end-to-end encrypted above that, so LiveKit forwards
      # frames it cannot read.
      - "7881:7881"
      - "7882:7882/udp"
